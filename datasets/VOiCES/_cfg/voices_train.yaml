devkit_root: external/VOiCES_devkit
distant_root: distant-16k/speech

split: test            # train or test
rooms: [rm4]            # e.g., [rm1, rm2, rm3, rm4]
conditions: [babb, musi]      # folder under room, Choices: musi, babb, tele
speakers: []            # empty is for all speakers, or specify like [sp6550, sp2952]
mic_types: []        # [stu] or [lav]
mic_locations: []    # [clo] or [far] or [clo, far]

max_hours: 1.0          # stop after selecting this many hours (approx)
seed: 1337
mode: symlink

out_root: datasets/VOiCES/train       # datasets/VOiCES/test for test set

exclude_speakers_from_manifest: null